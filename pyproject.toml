[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-reformulation-engine"
version = "0.1.0"
description = "AI-Powered Enterprise Query Reformulation & Search Engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
chunking = ["tiktoken>=0.7", "pyyaml>=6.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "corpus_validation*",
    "document_chunking*",
    "embedding*",
    "evaluation*",
    "reformulation*",
    "retrieval*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
